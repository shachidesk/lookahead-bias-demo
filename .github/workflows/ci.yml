name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Tests
        run: pytest

      # 通っているテストが、見張っているのか素通りしているのかを確かめる。
      # 正しい実装をわざと壊し、テストが落ちなければこの job も落とす。
      - name: Mutation check (テストの検出力)
        run: python tools/mutation_check.py

      # 変異は必ず元に戻す設計だが、戻し損ねを CI 側でも見張る。
      - name: 変異が残っていないこと
        run: git diff --exit-code
